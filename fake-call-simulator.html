<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مكالمة واردة - ليلى</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

  /* ========== SETUP SCREEN ========== */
  #setupScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 20px; padding: 24px;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
  }
  #setupScreen h1 { font-size: 1.6rem; font-weight: 700; text-align: center; }
  #setupScreen p { font-size: 0.85rem; opacity: 0.6; text-align: center; line-height: 1.5; }
  .delay-btn {
    background: linear-gradient(135deg, #4a6cf7, #5b3ff7);
    color: #fff; border: none; border-radius: 16px;
    padding: 16px 32px; font-size: 1.05rem; font-weight: 600;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 20px rgba(74,108,247,0.4);
  }
  .delay-btn:active { transform: scale(0.96); }
  #countdownDisplay {
    font-size: 3rem; font-weight: 800; color: #4a6cf7;
    display: none; margin-top: 10px;
  }
  .hint { font-size: 0.75rem; opacity: 0.4; margin-top: 8px; }

  /* ========== INCOMING CALL SCREEN ========== */
  #callScreen {
    display: none; flex-direction: column; align-items: center; justify-content: space-between;
    height: 100%; padding: 50px 30px 60px;
    background: linear-gradient(180deg, #2a2a3c 0%, #1a1a2e 100%);
    color: #fff;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .caller-info { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 40px; }
  .avatar {
    width: 110px; height: 110px; border-radius: 50%;
    background: linear-gradient(135deg, #e83e8c, #6f42c1);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; font-weight: 700; color: #fff;
    box-shadow: 0 0 30px rgba(232,62,140,0.3);
    animation: pulseAvatar 2s infinite ease-in-out;
  }
  @keyframes pulseAvatar {
    0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(232,62,140,0.3); }
    50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(232,62,140,0.5); }
  }
  .caller-name { font-size: 2rem; font-weight: 700; margin-top: 8px; }
  .caller-status { font-size: 0.9rem; opacity: 0.5; }
  .caller-status.ringing::after { content: '...'; animation: dots 1.5s infinite; }
  @keyframes dots { 0% { content: ''; } 33% { content: '.'; } 66% { content: '..'; } 100% { content: '...'; } }

  .call-actions { display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
  .action-row { display: flex; justify-content: space-around; width: 100%; max-width: 320px; }
  .action-btn {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer; transition: transform .15s;
  }
  .action-btn:active { transform: scale(0.92); }
  .action-circle {
    width: 72px; height: 72px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .accept-btn .action-circle { background: #30d158; animation: acceptPulse 1.2s infinite; }
  .decline-btn .action-circle { background: #ff3b30; }
  @keyframes acceptPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(48,209,88,0.5); }
    50% { box-shadow: 0 0 0 14px rgba(48,209,88,0); }
  }
  .action-label { font-size: 0.8rem; opacity: 0.7; }

  /* swipe hint */
  .swipe-hint { font-size: 0.7rem; opacity: 0.3; margin-top: 10px; }

  /* ========== ACTIVE CALL SCREEN ========== */
  #activeCallScreen {
    display: none; flex-direction: column; align-items: center; justify-content: space-between;
    height: 100%; padding: 60px 30px 60px;
    background: linear-gradient(180deg, #1c1c2e 0%, #0d0d1a 100%);
    color: #fff; animation: fadeIn 0.4s ease;
  }
  .active-info { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
  .active-avatar {
    width: 90px; height: 90px; border-radius: 50%;
    background: linear-gradient(135deg, #e83e8c, #6f42c1);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.4rem; font-weight: 700;
  }
  .active-name { font-size: 1.6rem; font-weight: 600; margin-top: 6px; }
  .call-timer { font-size: 1.1rem; opacity: 0.5; font-variant-numeric: tabular-nums; }
  .speaking-indicator {
    display: none; align-items: center; gap: 4px; margin-top: 6px;
  }
  .speaking-indicator span {
    width: 4px; height: 20px; background: #4a6cf7; border-radius: 2px;
    animation: speakBar 0.6s infinite ease-in-out;
  }
  .speaking-indicator span:nth-child(2) { animation-delay: 0.1s; }
  .speaking-indicator span:nth-child(3) { animation-delay: 0.2s; }
  .speaking-indicator span:nth-child(4) { animation-delay: 0.15s; }
  .speaking-indicator span:nth-child(5) { animation-delay: 0.05s; }
  @keyframes speakBar {
    0%, 100% { height: 6px; } 50% { height: 24px; }
  }

  .end-call-btn {
    width: 72px; height: 72px; border-radius: 50%;
    background: #ff3b30; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(255,59,48,0.4);
    transition: transform .15s;
  }
  .end-call-btn:active { transform: scale(0.92); }
  .end-call-btn svg { width: 32px; height: 32px; fill: #fff; }

  .call-controls-row { display: flex; gap: 30px; margin-bottom: 10px; }
  .control-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; opacity: 0.6; transition: opacity .15s;
  }
  .control-btn:active { opacity: 1; }
  .control-circle {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
  }
  .control-label { font-size: 0.7rem; opacity: 0.5; }

  /* ========== ENDED SCREEN ========== */
  #endedScreen {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 16px; padding: 30px;
    background: linear-gradient(180deg, #1a1a2e, #0d0d1a);
    color: #fff; animation: fadeIn 0.4s ease;
  }
  #endedScreen .ended-icon { font-size: 3rem; opacity: 0.3; }
  #endedScreen .ended-text { font-size: 1.2rem; opacity: 0.6; }
  .restart-btn {
    background: rgba(255,255,255,0.12); color: #fff; border: none;
    border-radius: 14px; padding: 14px 28px; font-size: 0.95rem;
    cursor: pointer; transition: transform .15s; margin-top: 10px;
  }
  .restart-btn:active { transform: scale(0.95); }

  /* Utility */
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setupScreen">
  <h1>📞 محاكاة مكالمة واردة</h1>
  <p>اضغط الزر أدناه ثم ضع الهاتف جانباً<br>ستبدأ المكالمة الواردة تلقائياً بعد 5 ثوانٍ</p>
  <button class="delay-btn" id="startBtn">ابدأ المحاكاة بعد 5 ثوانٍ</button>
  <div id="countdownDisplay">5</div>
  <p class="hint">يمكنك أيضاً الضغط على "رفض" أو "قبول" عند ظهور المكالمة</p>
</div>

<!-- INCOMING CALL SCREEN -->
<div id="callScreen">
  <div class="caller-info">
    <div class="avatar">ل</div>
    <div class="caller-name">ليلى</div>
    <div class="caller-status ringing" id="ringingStatus">جاري الاتصال</div>
  </div>
  <div class="call-actions">
    <div class="action-row">
      <div class="action-btn decline-btn" id="declineBtn">
        <div class="action-circle">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.42 4.67c.18.18.29.43.29.71 0 .28-.11.52-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28a11.27 11.27 0 0 0-2.66-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z" transform="rotate(135 12 12)"/></svg>
        </div>
        <span class="action-label">رفض</span>
      </div>
      <div class="action-btn accept-btn" id="acceptBtn">
        <div class="action-circle">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </div>
        <span class="action-label">قبول</span>
      </div>
    </div>
    <div class="swipe-hint">اسحب للرد</div>
  </div>
</div>

<!-- ACTIVE CALL SCREEN -->
<div id="activeCallScreen">
  <div class="active-info">
    <div class="active-avatar">ل</div>
    <div class="active-name">ليلى</div>
    <div class="call-timer" id="callTimer">00:00</div>
    <div class="speaking-indicator" id="speakingIndicator">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  <div class="call-controls-row">
    <div class="control-btn"><div class="control-circle">🔇</div><span class="control-label">كتم</span></div>
    <div class="control-btn"><div class="control-circle">🔢</div><span class="control-label">لوحة</span></div>
    <div class="control-btn"><div class="control-circle">🔊</div><span class="control-label">سماعة</span></div>
  </div>
  <button class="end-call-btn" id="endCallBtn">
    <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" transform="rotate(135 12 12)"/></svg>
  </button>
</div>

<!-- ENDED SCREEN -->
<div id="endedScreen">
  <div class="ended-icon">📞</div>
  <div class="ended-text">انتهت المكالمة</div>
  <button class="restart-btn" id="restartBtn">محاكاة جديدة</button>
</div>

<script>
(function() {
  'use strict';

  // ===== STATE =====
  let ringtoneInterval = null;
  let ringtoneOsc = null;
  let ringtoneGain = null;
  let audioCtx = null;
  let callTimerInterval = null;
  let callSeconds = 0;
  let currentUtterance = null;
  let speakingActive = false;

  // ===== ELEMENTS =====
  const setupScreen = document.getElementById('setupScreen');
  const callScreen = document.getElementById('callScreen');
  const activeCallScreen = document.getElementById('activeCallScreen');
  const endedScreen = document.getElementById('endedScreen');
  const startBtn = document.getElementById('startBtn');
  const countdownDisplay = document.getElementById('countdownDisplay');
  const acceptBtn = document.getElementById('acceptBtn');
  const declineBtn = document.getElementById('declineBtn');
  const endCallBtn = document.getElementById('endCallBtn');
  const restartBtn = document.getElementById('restartBtn');
  const callTimer = document.getElementById('callTimer');
  const speakingIndicator = document.getElementById('speakingIndicator');

  // ===== AUDIO: SYNTHESIZED RINGTONE =====
  function initAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playRingtone() {
    initAudioCtx();
    // Classic phone ringtone pattern using oscillators
    const now = audioCtx.currentTime;

    // Ring pattern: 2 seconds on, 4 seconds off (repeating)
    function ringBurst(startTime) {
      for (let i = 0; i < 2; i++) {
        const t = startTime + i * 0.4;
        // High tone
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(440, t);
        osc1.frequency.setValueAtTime(480, t + 0.1);
        gain1.gain.setValueAtTime(0, t);
        gain1.gain.linearRampToValueAtTime(0.15, t + 0.02);
        gain1.gain.setValueAtTime(0.15, t + 0.18);
        gain1.gain.linearRampToValueAtTime(0, t + 0.2);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(t);
        osc1.stop(t + 0.2);

        // Low tone
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(440, t + 0.2);
        osc2.frequency.setValueAtTime(480, t + 0.3);
        gain2.gain.setValueAtTime(0, t + 0.2);
        gain2.gain.linearRampToValueAtTime(0.15, t + 0.22);
        gain2.gain.setValueAtTime(0.15, t + 0.38);
        gain2.gain.linearRampToValueAtTime(0, t + 0.4);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(t + 0.2);
        osc2.stop(t + 0.4);
      }
    }

    let cycleStart = audioCtx.currentTime;
    ringtoneInterval = setInterval(() => {
      ringBurst(audioCtx.currentTime);
    }, 3000);
    // First burst immediately
    ringBurst(audioCtx.currentTime);
  }

  function stopRingtone() {
    if (ringtoneInterval) {
      clearInterval(ringtoneInterval);
      ringtoneInterval = null;
    }
    if (audioCtx) {
      // Let any scheduled oscillators finish naturally
    }
  }

  // ===== AUDIO: VIBRATION =====
  function startVibration() {
    if ('vibrate' in navigator) {
      navigator.vibrate([400, 200, 400, 200, 400, 200, 400, 200, 400, 600, 400, 600, 400]);
    }
  }

  // ===== SPEECH SYNTHESIS =====
  function speak(text, rate, pitch, callback) {
    if (!('speechSynthesis' in window)) {
      if (callback) callback();
      return;
    }

    // Cancel any ongoing speech
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ar-SA';
    utterance.rate = rate;
    utterance.pitch = pitch;
    utterance.volume = 1;

    currentUtterance = utterance;

    utterance.onend = function() {
      currentUtterance = null;
      if (callback) callback();
    };

    utterance.onerror = function() {
      currentUtterance = null;
      if (callback) callback();
    };

    // Small delay between segments
    setTimeout(() => {
      window.speechSynthesis.speak(utterance);
    }, 300);
  }

  function playAcceptSpeechSequence() {
    speakingActive = true;
    speakingIndicator.style.display = 'flex';

    // Segment 1: Soft
    speak('ألو... وينك؟ راني نستنى فيك من بكري...', 0.9, 1.1, function() {
      if (!speakingActive) return;

      // Segment 2: Loud emotional spike
      speak('علااااش ما تجاوبش عليا!! وين كنت!!', 1.3, 1.4, function() {
        if (!speakingActive) return;

        // Segment 3: Sad outro
        speak('خلاص... راني زعفت عليك، باي.', 0.8, 0.8, function() {
          speakingActive = false;
          speakingIndicator.style.display = 'none';
          // Auto-end call after a brief pause
          setTimeout(() => {
            if (activeCallScreen.style.display !== 'none') {
              endCall();
            }
          }, 1500);
        });
      });
    });
  }

  // ===== SCREEN NAVIGATION =====
  function showScreen(screen) {
    setupScreen.classList.add('hidden');
    callScreen.classList.add('hidden');
    activeCallScreen.classList.add('hidden');
    endedScreen.classList.add('hidden');
    screen.classList.remove('hidden');
    screen.style.display = screen === setupScreen ? 'flex' :
                           screen === callScreen ? 'flex' :
                           screen === activeCallScreen ? 'flex' : 'flex';
  }

  function startCountdown() {
    startBtn.style.display = 'none';
    countdownDisplay.style.display = 'block';
    let count = 5;
    countdownDisplay.textContent = count;

    const countInterval = setInterval(() => {
      count--;
      if (count > 0) {
        countdownDisplay.textContent = count;
      } else {
        clearInterval(countInterval);
        countdownDisplay.style.display = 'none';
        startBtn.style.display = '';
        triggerIncomingCall();
      }
    }, 1000);
  }

  function triggerIncomingCall() {
    showScreen(callScreen);
    // Initialize audio context on user gesture chain
    initAudioCtx();
    playRingtone();
    startVibration();
  }

  function acceptCall() {
    stopRingtone();
    showScreen(activeCallScreen);

    // Start timer
    callSeconds = 0;
    callTimer.textContent = '00:00';
    callTimerInterval = setInterval(() => {
      callSeconds++;
      const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
      const secs = String(callSeconds % 60).padStart(2, '0');
      callTimer.textContent = mins + ':' + secs;
    }, 1000);

    // Start speech sequence
    playAcceptSpeechSequence();
  }

  function endCall() {
    stopRingtone();
    clearInterval(callTimerInterval);
    callTimerInterval = null;
    speakingActive = false;
    speakingIndicator.style.display = 'none';

    // Cancel any speech
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }

    // Stop vibration
    if ('vibrate' in navigator) {
      navigator.vibrate(0);
    }

    showScreen(endedScreen);
  }

  function declineCall() {
    stopRingtone();
    if ('vibrate' in navigator) navigator.vibrate(0);
    showScreen(endedScreen);
  }

  function restart() {
    showScreen(setupScreen);
  }

  // ===== EVENT LISTENERS =====
  startBtn.addEventListener('click', startCountdown);

  acceptBtn.addEventListener('click', function() {
    acceptCall();
  });

  declineBtn.addEventListener('click', function() {
    declineCall();
  });

  endCallBtn.addEventListener('click', function() {
    endCall();
  });

  restartBtn.addEventListener('click', restart);

  // Prevent context menu on long press
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Handle speech synthesis resume (Chrome bug)
  if ('speechSynthesis' in window) {
    setInterval(() => {
      if (speakingActive && !window.speechSynthesis.speaking && currentUtterance) {
        window.speechSynthesis.resume();
      }
    }, 5000);
  }

})();
</script>
</body>
</html>
