<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فطرة وسكينة — المشهد السينمائي الحي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Cairo',sans-serif;background:#0a0806;color:#f0e6d3;overflow:hidden;height:100vh;position:fixed;width:100%}

  /* SCENE BACKGROUNDS */
  .scene-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:0;transition:opacity 1.8s ease,transform 1.8s ease;background-size:cover;background-position:center;overflow:hidden}
  .scene-bg.active{opacity:1}
  .scene-bg video{width:100%;height:100%;object-fit:cover}
  .scene-bg.active:not(.video-bg){animation:kenburns 30s ease-out forwards}
  @keyframes kenburns{0%{transform:scale(1) translate(0,0)}50%{transform:scale(1.1) translate(-1%,-1%)}100%{transform:scale(1.15) translate(-2%,-1.5%)}}

  /* CSS oil-painting backgrounds (replace missing images) */
  #bg_sheikh_tent{background:radial-gradient(ellipse at 50% 38%,#3a2a14 0%,#1a1208 40%,#0a0806 80%),radial-gradient(ellipse at 30% 62%,rgba(212,175,100,0.1) 0%,transparent 50%),linear-gradient(180deg,#2a1e10 0%,#1a1410 50%,#0a0806 100%)}
  #bg_groom_sheikh{background:radial-gradient(ellipse at 45% 35%,#4a3418 0%,#2a1e10 40%,#0a0806 80%),radial-gradient(ellipse at 62% 52%,rgba(212,175,100,0.08) 0%,transparent 50%),linear-gradient(160deg,#3a2a14 0%,#1a1410 60%,#0a0806 100%)}
  #bg_men_outside{background:radial-gradient(ellipse at 50% 28%,#2a2418 0%,#1a1810 40%,#0a0806 80%),radial-gradient(ellipse at 72% 72%,rgba(180,140,80,0.06) 0%,transparent 50%),linear-gradient(180deg,#1a1814 0%,#14120e 50%,#0a0806 100%)}
  #bg_contract{background:radial-gradient(ellipse at 50% 45%,#3a2a10 0%,#1a1408 35%,#0a0806 80%),radial-gradient(circle at 38% 42%,rgba(212,175,100,0.12) 0%,transparent 30%),linear-gradient(135deg,#2a1e10 0%,#1a1410 50%,#0a0806 100%)}
  #bg_tent_night{background:radial-gradient(ellipse at 50% 40%,rgba(212,175,100,0.06) 0%,transparent 40%),radial-gradient(ellipse at 30% 60%,#1a1814 0%,#0e0c08 50%,#0a0806 80%),linear-gradient(180deg,#0e0c08 0%,#0a0806 50%,#050402 100%)}

  /* OVERLAY + FLICKER */
  .scene-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,8,6,0.3) 0%,rgba(10,8,6,0.1) 35%,rgba(10,8,6,0.85) 100%)}
  .scene-overlay::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;
    background:radial-gradient(ellipse at 50% 35%,rgba(212,175,100,0.06) 0%,transparent 60%);
    animation:flicker 4s ease-in-out infinite;pointer-events:none}
  @keyframes flicker{0%,100%{opacity:.5}25%{opacity:.85}50%{opacity:.3}75%{opacity:.7}}

  /* TOP BAR */
  .top-bar{position:fixed;top:0;left:0;width:100%;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:linear-gradient(180deg,rgba(10,8,6,0.5) 0%,transparent 100%)}
  .progress-dots{display:flex;gap:5px}
  .pdot{width:5px;height:5px;border-radius:50%;background:rgba(212,175,100,0.2);transition:all .4s}
  .pdot.on{background:#d4af64;transform:scale(1.6)}
  .pdot.done{background:rgba(212,175,100,0.5)}
  .sound-btn{width:36px;height:36px;border-radius:50%;background:rgba(10,8,6,0.6);border:1px solid rgba(212,175,100,0.2);color:#d4af64;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .scene-label{font-family:'Amiri',serif;font-size:.78rem;color:rgba(212,175,100,0.6)}

  /* HADITH DISPLAY */
  .hadith-display{position:fixed;bottom:180px;left:50%;transform:translateX(-50%);width:90%;max-width:400px;z-index:54;opacity:0;transition:opacity 1.5s;pointer-events:none}
  .hadith-display.show{opacity:1}
  .hadith-box{background:rgba(10,8,6,0.8);border:1px solid rgba(212,175,100,0.2);border-radius:14px;padding:16px 22px;font-family:'Amiri',serif;font-size:.88rem;line-height:2;color:#b8d4a0;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 25px rgba(0,0,0,0.5)}
  .hadith-box .ref{font-size:.65rem;color:#6a8a50;margin-top:5px}

  /* VERSE DISPLAY */
  .verse-display{position:fixed;bottom:180px;left:50%;transform:translateX(-50%);width:90%;max-width:400px;z-index:55;opacity:0;transition:opacity 1.5s;pointer-events:none}
  .verse-display.show{opacity:1}
  .verse-box{background:rgba(10,8,6,0.8);border:1px solid rgba(212,175,100,0.25);border-radius:14px;padding:18px 24px;font-family:'Amiri',serif;font-size:.98rem;line-height:2.2;color:#d4af64;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 25px rgba(0,0,0,0.5)}
  .verse-box .ref{font-size:.68rem;color:#8a7050;margin-top:6px}

  /* NARRATION */
  .narration{position:fixed;bottom:0;left:0;width:100%;z-index:50;padding:20px 20px 70px;background:linear-gradient(0deg,rgba(10,8,6,0.92) 0%,rgba(10,8,6,0.2) 60%,transparent 100%);pointer-events:none}
  .narr-inner{max-width:440px;margin:0 auto;text-align:center}
  .narr-icon{font-size:1.2rem;margin-bottom:4px;opacity:.8}
  .narr-text{font-family:'Amiri',serif;font-size:.85rem;color:rgba(232,213,160,0.7);line-height:1.8;min-height:1em;text-shadow:0 2px 10px rgba(0,0,0,0.9)}
  .narr-status{font-size:.6rem;color:#8a7050;margin-top:3px}

  .speaking-indicator{display:inline-flex;gap:2px;align-items:center;justify-content:center;height:12px}
  .speaking-indicator span{width:3px;height:3px;border-radius:50%;background:#d4af64;animation:pulse 1s infinite}
  .speaking-indicator span:nth-child(2){animation-delay:.2s}
  .speaking-indicator span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

  /* INTERACTION */
  .interact{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;z-index:70;pointer-events:auto;display:none}
  .interact.show{display:block;animation:iu .5s ease}
  @keyframes iu{from{opacity:0;transform:translateX(-50%) translateY(15px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .i-card{background:rgba(10,8,6,0.93);border:1px solid rgba(212,175,100,0.25);border-radius:18px;padding:20px;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);box-shadow:0 8px 30px rgba(0,0,0,0.5)}
  .i-title{font-family:'Amiri',serif;font-size:1.1rem;color:#d4af64;text-align:center;margin-bottom:12px}
  .i-input{width:100%;background:rgba(10,8,6,0.5);border:1px solid rgba(212,175,100,0.15);border-radius:12px;padding:13px 16px;color:#f0e6d3;font-size:.9rem;font-family:'Cairo';margin-bottom:10px}
  .i-input:focus{outline:none;border-color:#d4af64}
  .btn{background:linear-gradient(135deg,#8b6914,#d4af64);color:#1a1410;border:none;border-radius:12px;padding:13px 30px;font-size:.92rem;font-weight:700;cursor:pointer;transition:transform .15s;font-family:'Cairo';width:100%}
  .btn:active{transform:scale(.96)}
  .btn-outline{background:transparent;border:1px solid rgba(212,175,100,0.3);color:#d4af64}
  .btn-outline:active{transform:scale(.96)}

  .rf{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .rl{font-size:.74rem;color:#c4a880;font-weight:600}
  .ri,.rs{background:rgba(10,8,6,0.5);border:1px solid rgba(212,175,100,0.15);border-radius:10px;padding:10px 12px;color:#f0e6d3;font-size:.84rem;font-family:'Cairo'}
  .ri:focus,.rs:focus{outline:none;border-color:#d4af64}
  .rs option{background:#2a1e14}
  .rr{display:flex;gap:8px}
  .rr .rf{flex:1}
  .rt{background:rgba(10,8,6,0.5);border:1px solid rgba(212,175,100,0.15);border-radius:10px;padding:10px 12px;color:#f0e6d3;font-size:.84rem;font-family:'Cairo';min-height:50px;resize:vertical}
  .rt:focus{outline:none;border-color:#d4af64}
  .reg-scroll{max-height:55vh;overflow-y:auto}
  .pcheck{width:20px;height:20px;border:2px solid #d4af64;border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .pcheck.on{background:#d4af64}
  .pcheck.on::after{content:'✓';color:#1a1410;font-size:.75rem;font-weight:bold}

  /* PIONEER BADGE */
  .pioneer-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,rgba(212,175,100,0.15),rgba(212,175,100,0.05));border:1px solid rgba(212,175,100,0.3);border-radius:10px;padding:6px 12px;font-size:.72rem;color:#d4af64;font-weight:700}
  .pioneer-counter{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:101;font-size:.7rem;color:#d4af64;background:rgba(10,8,6,0.7);border:1px solid rgba(212,175,100,0.2);border-radius:10px;padding:4px 12px;backdrop-filter:blur(8px)}

  .guide-c{background:rgba(10,8,6,0.6);border:1px solid rgba(212,175,100,0.12);border-radius:12px;padding:12px;margin-bottom:8px}
  .guide-c h4{font-size:.78rem;color:#d4af64;font-weight:700;margin-bottom:4px}
  .guide-c p{font-size:.74rem;color:#c4a880;line-height:1.5}
  .experts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .expert{background:rgba(212,175,100,0.06);border:1px solid rgba(212,175,100,0.1);border-radius:8px;padding:3px 7px;font-size:.56rem;color:#7a6850}

  /* AI SUPPORT */
  .ai-btn{position:fixed;bottom:15px;left:15px;z-index:999;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#25D366,#128C7E);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(37,211,102,0.3)}
  .ai-btn:active{transform:scale(.9)}
  .ai-btn svg{width:24px;height:24px;fill:#fff}
  .ai-bdg{position:absolute;top:-2px;right:-2px;width:14px;height:14px;background:#ff3b30;border-radius:50%;border:2px solid #0a0806}
  .ai-panel{position:fixed;bottom:0;left:0;width:100%;max-height:65vh;z-index:1000;background:rgba(10,8,6,0.98);border-top:2px solid #d4af64;border-radius:20px 20px 0 0;display:none;flex-direction:column;padding-bottom:15px}
  .ai-panel.show{display:flex;animation:pu .3s ease}
  @keyframes pu{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .ai-h{padding:14px 18px;border-bottom:1px solid rgba(212,175,100,0.15);display:flex;justify-content:space-between;align-items:center}
  .ai-h span{font-size:.85rem;font-weight:700;color:#d4af64}
  .ai-x{background:none;border:none;color:#a0876a;font-size:1.4rem;cursor:pointer}
  .ai-m{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;max-height:40vh}
  .am{padding:9px 13px;font-size:.78rem;max-width:85%;line-height:1.5;border-radius:11px}
  .am.ai{align-self:flex-start;background:rgba(212,175,100,0.1);border:1px solid rgba(212,175,100,0.15);border-radius:11px 11px 11px 4px;color:#c4a880}
  .am.user{align-self:flex-end;background:rgba(37,211,102,0.12);border-radius:11px 11px 4px 11px;color:#f0e6d3}
  .am.sys{align-self:center;font-size:.66rem;color:#8a7050;background:rgba(212,175,100,0.05);border-radius:8px;padding:3px 10px}
  .ai-i{padding:8px 16px;display:flex;gap:6px}
  .ai-i input{flex:1;background:rgba(10,8,6,0.6);border:1px solid rgba(212,175,100,0.15);border-radius:10px;padding:9px 12px;color:#f0e6d3;font-size:.78rem;font-family:'Cairo'}
  .ai-i input:focus{outline:none;border-color:#d4af64}
  .ai-s{background:#d4af64;color:#1a1410;border:none;border-radius:10px;padding:9px 14px;font-size:.78rem;font-weight:700;cursor:pointer}

  /* START SCREEN */
  .start-screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,8,6,0.85)}
  .start-screen.hide{opacity:0;pointer-events:none;transition:opacity 1s}
  .start-title{font-family:'Amiri',serif;font-size:2.5rem;color:#d4af64;text-shadow:0 0 40px rgba(212,175,100,0.3);margin-bottom:10px}
  .start-sub{font-size:.82rem;color:#a0876a;text-align:center;margin-bottom:30px;max-width:320px;line-height:1.7}
  .start-btn{background:linear-gradient(135deg,#8b6914,#d4af64);color:#1a1410;border:none;border-radius:16px;padding:16px 50px;font-size:1.1rem;font-weight:700;cursor:pointer;font-family:'Cairo';box-shadow:0 5px 25px rgba(139,105,20,0.4);transition:transform .2s}
  .start-btn:active{transform:scale(.95)}
  .start-note{font-size:.68rem;color:#6a5a45;margin-top:15px;max-width:280px;text-align:center;line-height:1.5}
</style>
</head>
<body>

<!-- SCENE BACKGROUNDS -->
<div class="scene-bg video-bg" id="bg_storm"><video loop muted playsinline><source src="https://assets.mixkit.co/videos/25081/25081-720.mp4" type="video/mp4"></video></div>
<div class="scene-bg video-bg" id="bg_desert_night"><video loop muted playsinline><source src="https://assets.mixkit.co/videos/46061/46061-720.mp4" type="video/mp4"></video></div>
<div class="scene-bg video-bg" id="bg_dunes"><video loop muted playsinline><source src="https://assets.mixkit.co/videos/4149/4149-720.mp4" type="video/mp4"></video></div>
<div class="scene-bg" id="bg_sheikh_tent"></div>
<div class="scene-bg" id="bg_groom_sheikh"></div>
<div class="scene-bg" id="bg_men_outside"></div>
<div class="scene-bg" id="bg_contract"></div>
<div class="scene-bg" id="bg_tent_night"></div>

<div class="scene-overlay"></div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="progress-dots" id="progress"></div>
  <div class="scene-label" id="sceneLabel"></div>
  <div class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</div>
</div>

<!-- PIONEER COUNTER -->
<div class="pioneer-counter" id="pioneerCounter" style="display:none"></div>

<!-- HADITH DISPLAY -->
<div class="hadith-display" id="hadithDisp"><div class="hadith-box" id="hadithBox"></div></div>

<!-- VERSE DISPLAY -->
<div class="verse-display" id="verseDisp"><div class="verse-box" id="verseBox"></div></div>

<!-- NARRATION -->
<div class="narration">
  <div class="narr-inner">
    <div class="narr-icon" id="narrIcon">🏜️</div>
    <div class="narr-text" id="narrText"></div>
    <div class="narr-status" id="narrStatus"></div>
  </div>
</div>

<!-- INTERACTION -->
<div class="interact" id="interact"></div>

<!-- START SCREEN -->
<div class="start-screen" id="startScreen">
  <div class="start-title">فطرة وسكينة</div>
  <div class="start-sub">مشهدٌ سينمائيٌّ حي<br>صوتٌ عربيٌّ حقيقي • فيديو حقيقي • تلاوة حقيقية<br>اضغط وفعّل الصوت 🔊</div>
  <button class="start-btn" onclick="startFilm()">ابدأ المشهد 🪔</button>
  <div class="start-note">يُنصح بالسماعات لإدراك السرد الصوتي العربي والآيات القرآنية. المشهد يستخدم صوت المتصفح العربي للتلقين.</div>
</div>

<!-- AI SUPPORT -->
<button class="ai-btn" onclick="aiToggle()">
  <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 2.99.97 4.29L2 22l5.71-.97C9.01 21.64 10.46 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
  <div class="ai-bdg" id="aiBdg"></div>
</button>
<div class="ai-panel" id="aiPanel">
  <div class="ai-h"><span>🤖 وكيل الدعم الفني الذكي</span><button class="ai-x" onclick="aiToggle()">×</button></div>
  <div class="ai-m" id="aiMsgs"><div class="am ai">السلام عليكم 🤝 أنا وكيل الدعم الفني. كيف يمكنني مساعدتك؟</div></div>
  <div class="ai-i"><input type="text" id="aiInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter'||event.keyCode===13){event.preventDefault();aiSend()}"><button class="ai-s" onclick="aiSend()">إرسال</button></div>
</div>

<script>
(function(){
'use strict';

var activeTimers=[];var sceneId=0;
function safeTimeout(fn,delay){var id=sceneId;var t=setTimeout(function(){if(id===sceneId)fn()},delay);activeTimers.push(t);return t}
function clearSceneTimers(){sceneId++;activeTimers.forEach(clearTimeout);activeTimers=[]}

var soundOn=true;var audioCtx=null;var ambientNodes=null;var currentAudio=null;var currentAmbientType='storm';

function initAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}}
  if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume()}
}

function startAmbient(type){
  if(!soundOn)return;initAudio();if(!audioCtx)return;stopAmbient();
  var bs=4*audioCtx.sampleRate;var buf=audioCtx.createBuffer(1,bs,audioCtx.sampleRate);
  var d=buf.getChannelData(0);for(var i=0;i<bs;i++){d[i]=(Math.random()*2-1)*0.3}
  var n=audioCtx.createBufferSource();n.buffer=buf;n.loop=true;
  var f=audioCtx.createBiquadFilter();f.type='lowpass';
  f.frequency.value=type==='storm'?400:type==='night'?150:type==='tent'?300:250;f.Q.value=0.5;
  var g=audioCtx.createGain();g.gain.value=type==='storm'?0.06:type==='night'?0.04:type==='tent'?0.03:0.04;
  var lfo=audioCtx.createOscillator();lfo.frequency.value=0.1;var lg=audioCtx.createGain();lg.gain.value=0.02;
  lfo.connect(lg);lg.connect(g.gain);
  n.connect(f);f.connect(g);g.connect(audioCtx.destination);n.start();lfo.start();
  ambientNodes={noise:n,lfo:lfo,gain:g};
}
function stopAmbient(){
  if(ambientNodes){['noise','lfo'].forEach(function(k){if(ambientNodes[k]){try{ambientNodes[k].stop()}catch(e){}try{ambientNodes[k].disconnect()}catch(e){}}});ambientNodes=null}
}

function playAyah(surah,ayah,onEnded){
  if(!soundOn){if(onEnded)safeTimeout(onEnded,3000);return}
  initAudio();stopAyah();
  var url='https://everyayah.com/data/Alafasy_128kbps/'+String(surah).padStart(3,'0')+String(ayah).padStart(3,'0')+'.mp3';
  var a=new Audio();currentAudio=a;
  a.onerror=function(){if(currentAudio===a)currentAudio=null;if(onEnded)safeTimeout(onEnded,3000)};
  a.onended=function(){if(onEnded)safeTimeout(onEnded,1500)};
  a.src=url;a.play().catch(function(){if(onEnded)safeTimeout(onEnded,3000)});
}
function stopAyah(){if(currentAudio){currentAudio.pause();currentAudio.onerror=null;currentAudio.src='';currentAudio=null}}

function speak(text,onEnd){
  if(!soundOn){if(onEnd)onEnd();return}
  if(!('speechSynthesis' in window)){if(onEnd)onEnd();return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='ar-SA';u.rate=0.82;u.pitch=0.92;u.volume=0.9;
  var voices=speechSynthesis.getVoices();
  var arVoice=voices.find(function(v){return v.lang&&v.lang.toLowerCase().startsWith('ar')});
  if(arVoice)u.voice=arVoice;
  u.onend=function(){if(onEnd)onEnd()};
  u.onerror=function(){if(onEnd)onEnd()};
  document.getElementById('narrStatus').innerHTML='<span class="speaking-indicator"><span></span><span></span><span></span></span> صوتٌ يُتلى...';
  speechSynthesis.speak(u);
}
function stopSpeaking(){if('speechSynthesis' in window)speechSynthesis.cancel();document.getElementById('narrStatus').innerHTML=''}

window.toggleSound=function(){
  soundOn=!soundOn;
  document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';
  if(!soundOn){stopAyah();stopAmbient();stopSpeaking()}
  else{startAmbient(currentAmbientType)}
};

var allBgs=['bg_storm','bg_desert_night','bg_dunes','bg_sheikh_tent','bg_groom_sheikh','bg_men_outside','bg_contract','bg_tent_night'];
function showBg(id,ambient){
  allBgs.forEach(function(b){var el=document.getElementById(b);if(b===id){el.classList.add('active');var v=el.querySelector('video');if(v)v.play().catch(function(){})}else el.classList.remove('active')});
  var el=document.getElementById(id);
  if(el&&!el.classList.contains('video-bg')){el.style.animation='none';el.offsetHeight;el.style.animation=''}
  if(ambient&&ambient!==currentAmbientType){currentAmbientType=ambient;startAmbient(ambient)}
}

function showVerse(text,ref){document.getElementById('verseBox').innerHTML=text+'<div class="ref">'+ref+'</div>';document.getElementById('verseDisp').classList.add('show')}
